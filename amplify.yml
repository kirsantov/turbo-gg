version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm install
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm --filter web build
            # Copy hoisted node_modules from frontend root to appRoot for artifacts
            - cp -r $CODEBUILD_SRC_DIR/turbo-gg/frontend/node_modules $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/node_modules
      artifacts:
        baseDirectory: .
        files:
          - .next/**/*
          - node_modules/**/*
          - package.json
      cache:
        paths:
          - $CODEBUILD_SRC_DIR/turbo-gg/frontend/node_modules/**/*
          - ~/.cache/pnpm/**/*
