version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm install
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm --filter web build
            # DEBUG - explore standalone structure in monorepo
            - echo "=== .next/standalone/frontend contents ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/frontend/ || echo "not found"
            - echo "=== .next/standalone/frontend/apps contents ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/frontend/apps/ || echo "not found"
            - echo "=== .next/standalone/frontend/apps/web contents ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/frontend/apps/web/ || echo "not found"
            - echo "=== checking for node_modules in standalone ===" && find $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone -type d -name "node_modules" | head -5
      artifacts:
        baseDirectory: .next/standalone
        files:
          - '**/*'
      cache:
        paths:
          - $CODEBUILD_SRC_DIR/turbo-gg/frontend/node_modules/**/*
          - ~/.cache/pnpm/**/*
