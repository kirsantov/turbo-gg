version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm install
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm --filter web build
            # DEBUG - show current directory and structure
            - echo "=== PWD ===" && pwd
            - echo "=== CODEBUILD_SRC_DIR ===" && echo $CODEBUILD_SRC_DIR
            - echo "=== .next contents ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/
            - echo "=== .next/standalone contents ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/
            - echo "=== .next/standalone/node_modules check ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/node_modules/ | head -20
            - echo "=== looking for trace files ===" && find $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next -name "*.nft.json" | head -10
      artifacts:
        baseDirectory: .next/standalone
        files:
          - '**/*'
      cache:
        paths:
          - $CODEBUILD_SRC_DIR/turbo-gg/frontend/node_modules/**/*
          - ~/.cache/pnpm/**/*
