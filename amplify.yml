version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm install
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm --filter web build
            # Copy static files to standalone .next
            - cp -r $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/static $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/frontend/apps/web/.next/static
            # Copy node_modules to standalone root for Amplify (it expects it at root level)
            - cp -r $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/frontend/node_modules $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/node_modules
            # Debug - check final structure
            - echo "=== Final standalone structure ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/
            - echo "=== standalone/.next check ===" && ls -la $CODEBUILD_SRC_DIR/turbo-gg/frontend/apps/web/.next/standalone/frontend/apps/web/.next/ || echo "not found"
      artifacts:
        baseDirectory: .next/standalone/frontend/apps/web
        files:
          - '**/*'
      cache:
        paths:
          - $CODEBUILD_SRC_DIR/turbo-gg/frontend/node_modules/**/*
          - ~/.cache/pnpm/**/*
