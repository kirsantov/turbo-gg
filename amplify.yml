version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest --activate
            # Install from frontend workspace root
            - cd $CODEBUILD_SRC_DIR/turbo-gg/frontend && pnpm install
        build:
          commands:
            # Build using next directly
            - npx next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - $CODEBUILD_SRC_DIR/turbo-gg/frontend/node_modules/**/*
          - ~/.cache/pnpm/**/*
