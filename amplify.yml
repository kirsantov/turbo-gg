version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # Enable corepack and install pnpm
            - corepack enable
            - corepack prepare pnpm@latest --activate
            # Install all workspace dependencies using -C flag
            - pnpm -C ../.. install --frozen-lockfile
        build:
          commands:
            # Build the Next.js web application
            - pnpm -C ../.. --filter web build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      buildPath: /
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
          - ../../packages/types/node_modules/**/*
          - ../../packages/ui/node_modules/**/*
          - ~/.cache/pnpm/**/*
