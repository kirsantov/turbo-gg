version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Enable corepack and install pnpm
        - corepack enable
        - corepack prepare pnpm@latest --activate
        # Install all workspace dependencies
        - cd frontend && pnpm install --frozen-lockfile
    build:
      commands:
        # Build the Next.js web application
        - cd frontend && pnpm --filter web build
  artifacts:
    baseDirectory: frontend/apps/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/apps/web/node_modules/**/*
      - frontend/packages/types/node_modules/**/*
      - frontend/packages/ui/node_modules/**/*
      - ~/.cache/pnpm/**/*
