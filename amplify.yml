version: 1
applications:
  - appRoot: frontend/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # Enable corepack and install pnpm
            - corepack enable
            - corepack prepare pnpm@latest --activate
            # Install all workspace dependencies from frontend root
            - cd ../..
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Build from frontend workspace root
            - cd ../..
            - pnpm --filter web build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - node_modules/**/*
          - ../../packages/types/node_modules/**/*
          - ../../packages/ui/node_modules/**/*
          - ~/.cache/pnpm/**/*
